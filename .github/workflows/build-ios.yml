name: Build iOS IPA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # arm64 runner is required: the committed xcframeworks ship only iOS arm64 and
    # arm64-simulator slices, and package-leadgram-style.py hardcodes /opt/homebrew.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install build tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install xcodegen openssl@3
          xcodegen --version
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          python3 --version

      - name: Build unsigned IPA
        run: |
          set -o pipefail
          bash Scripts/build-ipa.sh 2>&1 | tee build-ipa.log

      - name: Surface build errors
        if: failure()
        run: |
          echo "::error::Xcode $(xcodebuild -version 2>&1 | tr '\n' ' ')| iOS SDK $(xcrun --sdk iphoneos --show-sdk-version 2>&1)"
          echo "::notice::Installed Xcodes: $(ls -d /Applications/Xcode*.app 2>/dev/null | tr '\n' ' ')"
          {
            echo "## Build failed - diagnostics"
            echo '```'
            xcodebuild -version 2>&1 || true
            echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version 2>&1)"
            echo "--- key error lines ---"
            grep -nE "error:|fatal error:|BUILD FAILED|The following build commands failed|clang: error|ld: error|xcodebuild: error|cannot find|only available|no such module" build-ipa.log | tail -n 60 || true
            echo "--- last 40 lines ---"
            tail -n 40 build-ipa.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "error:|BUILD FAILED|The following build commands failed|no such module|only available" build-ipa.log | tail -n 20 | while IFS= read -r line; do
            printf '::error::%s\n' "$line"
          done

      - name: Upload IPA artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: retools-ipa
          path: |
            Artifacts/*.ipa
            Artifacts/*.sha256
            Artifacts/*.json
          if-no-files-found: error