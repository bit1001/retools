name: Build iOS IPA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # arm64 runner is required: the committed xcframeworks ship only iOS arm64 and
    # arm64-simulator slices, and package-leadgram-style.py hardcodes /opt/homebrew.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install build tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install xcodegen openssl@3
          xcodegen --version
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          python3 --version

      - name: Build unsigned IPA
        run: |
          set -o pipefail
          bash Scripts/build-ipa.sh 2>&1 | tee build-ipa.log

      - name: Surface build errors
        if: failure()
        run: |
          L=build-ipa.log
          STATS="lines=$(wc -l < "$L") succeeded=$(grep -c 'BUILD SUCCEEDED' "$L") failed=$(grep -c 'BUILD FAILED' "$L") errcolon=$(grep -c ': error: ' "$L") traceback=$(grep -c 'Traceback' "$L")"
          echo "::error::STATS $STATS | Xcode $(xcodebuild -version 2>&1 | tr '\n' ' ')"
          ERRS=$(grep -nE "BUILD FAILED|following build commands failed|Traceback|AssertionError|CalledProcessError|RuntimeError|FileNotFoundError|fatal error:|clang: error|ld: error|xcodebuild: error|: error: |Segmentation fault|Abort trap|command not found|No such file or directory|Permission denied" "$L" | tail -n 25 | tr '\n' '|')
          echo "::error::ERRS ${ERRS//%/%25}"
          TAIL=$(tail -n 15 "$L" | tr '\n' '|')
          echo "::error::TAIL ${TAIL//%/%25}"
          {
            echo "## Build failed"
            echo "$STATS"
            echo '```'
            tail -n 60 "$L" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: retools-ipa
          path: |
            Artifacts/*.ipa
            Artifacts/*.sha256
            Artifacts/*.json
          if-no-files-found: error